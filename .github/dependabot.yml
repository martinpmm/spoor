version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # Pinned to match the CI browser download; bump deliberately.
      - dependency-name: '@playwright/test'
      # Types must match the oldest supported Node (22), or code using newer APIs would type-check.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
