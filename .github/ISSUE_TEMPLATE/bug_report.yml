name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real recorded events, typed values or prompts.** Spoor data can contain personal information.
        Reproduce with the fixture app (`npm run fixture`) or demo data (`npm run demo -w bridge`) if you can.
        A sensitive field that gets recorded, or data leaving the machine, is a security issue: report it privately as described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. The dashboard shows ...
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Extension (recording, popup, dashboard, settings)
        - Bridge (native messaging, register, SQLite)
        - MCP server / Claude
        - Install or docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spoor version or commit
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Edge 140, Brave 1.80 …
  - type: input
    id: os
    attributes:
      label: Operating system and Node version
      placeholder: macOS 15, Node 22.13
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The bridge status in settings, ~/.spoor/bridge.log, or the service worker console. Remove any personal data first.
      render: text
